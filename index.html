<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUNG JIN-WOO SYSTEM | V6.4 (USD STATS)</title>
    <style>
        :root {
            --bg: #05070b; --panel: rgba(17, 20, 29, 0.95); 
            
            /* Logic Colors */
            --mana: #00d2ff;      /* Current Quest */
            --debt-color: #bc13fe; /* Current Debt */
            --future-quest: #f1c40f; 
            --future-debt: #e74c3c;  

            /* Rank Colors */
            --rank-ss: #ffcc00; --rank-s: #ff3131; --rank-a: #bc13fe;
            --rank-b: #00d2ff; --rank-c: #4caf50; --rank-e: #9e9e9e;

            --gold: #ffd700; --danger: #ff3131; --text: #e6edf3; --success: #50fa7b;
            --inventory: #ff79c6; 
        }

        body { 
            background-color: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; 
            background-image: radial-gradient(circle at center, #101525 0%, #05070b 100%);
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 90px;
        }

        /* AUTH OVERLAY */
        #authOverlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 50000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .login-card {
            width: 85%; max-width: 400px; border: 1px solid var(--mana);
            padding: 40px 20px; text-align: center; background: rgba(0, 30, 50, 0.3);
        }

        /* HEADER */
        .system-header { 
            border: 1px solid var(--mana); background: rgba(0, 210, 255, 0.05); 
            padding: 15px; border-radius: 4px; margin-bottom: 20px; 
            position: relative;
        }

        .user-auth-bar { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--mana); margin-bottom: 10px; border-bottom: 1px solid rgba(0, 210, 255, 0.2); padding-bottom: 5px; }

        .player-status-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        .rank-tag { 
            background: rgba(0,0,0,0.6); border: 1px solid currentColor; 
            padding: 2px 10px; font-weight: 900; font-size: 0.8rem; 
            box-shadow: 0 0 10px currentColor;
        }

        .level-text { font-family: monospace; font-size: 0.9rem; color: var(--mana); }
        .gold-main { font-size: 2.4rem; color: var(--gold); display: block; font-weight: bold; text-align: center; margin: 5px 0; font-family: monospace; }
        
        /* CARDS */
        .quest-card { background: var(--panel); border: 1px solid #333; padding: 15px; margin-bottom: 15px; position: relative; clip-path: polygon(0 0, 100% 0, 100% 90%, 95% 100%, 0 100%); transition: 0.3s; overflow: hidden; }
        .locked-card { opacity: 0.7; filter: grayscale(0.2); border: 1px dashed #555; }
        .card-rank-badge { position: absolute; right: 10px; top: 10px; font-size: 2.5rem; font-weight: 900; font-style: italic; opacity: 0.15; pointer-events: none; z-index: 0; }

        /* BUTTONS */
        .btn-system { background: rgba(0, 0, 0, 0.7); border: 1px solid var(--mana); color: var(--mana); padding: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.7rem; width: 100%; transition: 0.2s; }
        .btn-system:active { transform: scale(0.95); background: var(--mana); color:black; }
        .btn-pay { background: var(--success); color: black; border: none; padding: 8px 15px; font-weight: bold; font-size: 0.75rem; cursor: pointer; width: 100%; margin-top: 10px; box-shadow: 0 0 10px rgba(80, 250, 123, 0.3); position: relative; z-index: 2; }
        .discard-btn { color: var(--danger); background: none; border: 1px solid rgba(255,49,49,0.2); padding: 3px 8px; font-size: 0.6rem; cursor: pointer; margin-top: 10px; display: inline-block; position: relative; z-index: 2; }
        .btn-zero { background: var(--danger); color: white; border: none; padding: 6px 12px; font-size: 0.7rem; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 8px; display: none; box-shadow: 0 0 8px var(--danger); }

        .salary-container { border: 1px solid var(--success); background: rgba(80, 250, 123, 0.05); padding: 12px; margin-bottom: 15px; text-align: center; border-radius: 4px; }
        .salary-value { font-size: 1.8rem; color: var(--success); font-weight: bold; font-family: monospace; display: block; }
        
        .progress-container { height: 6px; background: #000; margin-top: 15px; border: 1px solid #222; position: relative; z-index: 2; }
        .progress-fill { height: 100%; transition: width 0.5s; }

        .full-view { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 9999; padding: 20px; overflow-y: auto; }
        input { width: 100%; padding: 15px; margin-bottom: 10px; background: #080a0f; border: 1px solid #333; color: white; box-sizing: border-box; }
        
        .calendar-box { background: var(--panel); padding: 15px; border: 1px solid #222; margin-bottom: 20px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day-cell { aspect-ratio: 1; background: #080a0f; border: 1px solid #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: #444; cursor: pointer; position: relative; }
        .day-cell.has-completed { border-color: var(--gold); color: var(--gold); background: rgba(255, 215, 0, 0.1); }
        .day-cell.today { border: 2px solid #fff !important; color: #fff !important; font-weight: 900; background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); transform: scale(1.05); z-index: 2; }
        .day-cell.today.has-completed { border-color: #fff !important; color: var(--gold) !important; background: rgba(255, 215, 0, 0.15); }

        .stats-footer { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 30px; border-top: 1px solid #333; padding-top: 15px; }
        .stat-box { background: rgba(0,0,0,0.5); padding: 8px 4px; text-align: center; border: 1px solid #333; display: flex; flex-direction: column; justify-content: center; min-height: 70px; }
        .stat-title { font-size: 0.55rem; letter-spacing: 1px; margin-bottom: 5px; font-weight: bold; }
        .stat-val { font-size: 1.1rem; font-weight: bold; }
        .stat-sub { font-size: 0.75rem; color:var(--success); font-family: monospace; margin-top: 2px; font-weight:bold; }

        .archive-debt { border-left: 4px solid var(--debt-color) !important; }
        .archive-quest { border-left: 4px solid var(--mana) !important; }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="login-card">
            <div style="color:var(--mana); margin-bottom:20px; letter-spacing:3px;">SYSTEM ACCESS</div>
            <button class="btn-system" id="loginBtn" style="background: white; color: black; border: none;">INITIALIZE (GOOGLE)</button>
        </div>
    </div>

    <div id="mainView" style="display: none;">
        <div class="salary-container">
            <div style="font-size:0.6rem; color:var(--success); letter-spacing:2px;">SALARY WALLET</div>
            <span class="salary-value" id="salaryDisplay">$0.00</span>
            <div style="font-size:0.7rem; color:#888;">≈ <span id="salaryGoldDisplay">0</span> Gold</div>
            <button id="zeroSalary" class="btn-zero" onclick="confirmZero('salary')">Zero Remainder (<1k)</button>
            <div style="display:flex; gap:5px; margin-top:10px;">
                <button class="btn-system" style="border-color:var(--success); color:var(--success); flex:1;" onclick="addSalary()">+ Income</button>
                <button class="btn-system" style="border-color:var(--mana); color:var(--mana); flex:1;" onclick="salaryToVault()">Transfer</button>
            </div>
        </div>

        <div class="system-header">
            <div class="user-auth-bar">
                <span id="userEmailDisplay">---</span>
                <span style="color:var(--danger); cursor:pointer;" onclick="logout()">[ DISCONNECT ]</span>
            </div>

            <div class="player-status-row">
                <span class="level-text">LEVEL: <span id="playerLevel" style="color:white; font-weight:bold;">1</span></span>
                <div id="playerRankBadge" class="rank-tag" style="color:var(--rank-e)">RANK E</div>
            </div>
            
            <div style="font-size:0.6rem; color:#888; letter-spacing:1px; margin-top:5px;">NET WORTH (VAULT + QUESTS)</div>
            <span class="gold-main" id="totalAssets">0</span>
            <span id="totalUSD" style="text-align:center; display:block; color:var(--success); font-weight:bold; font-size:1.1rem;">$0.00</span>
        </div>

        <div class="main-actions" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
            <button class="btn-system" onclick="startFlowDeposit()">+ Add Assets</button>
            <button class="btn-system btn-withdraw" style="border-color:var(--danger); color:var(--danger);" onclick="globalWithdraw()">Withdrawal</button>
        </div>

        <div class="vault-container" style="border:1px solid var(--inventory); padding:12px; text-align:center; margin-bottom:15px;">
            <div style="font-size:0.6rem; color:var(--inventory); letter-spacing:1px;">STORAGE VAULT</div>
            <div id="vaultAmount" style="font-size:1.5rem; color:var(--inventory); font-weight:bold; font-family:monospace;">0</div>
            <button id="zeroVault" class="btn-zero" onclick="confirmZero('vault')">Zero Remainder (<1k)</button>
        </div>

        <div class="calendar-box">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; color:var(--mana); font-size:0.8rem;">
                <button onclick="changeMonth(-1)" style="background:none; border:none; color:inherit; cursor:pointer;">&lt;</button>
                <span id="monthTitle">MONTH</span>
                <button onclick="changeMonth(1)" style="background:none; border:none; color:inherit; cursor:pointer;">&gt;</button>
            </div>
            <div class="days-grid" id="daysGrid"></div>
        </div>

        <div style="background:rgba(0, 210, 255, 0.03); padding:15px; border:1px solid #222;">
            <div style="font-size:0.6rem; color:var(--mana); margin-bottom:5px;">QUICK ADD (FOR TODAY)</div>
            <input type="text" id="qTitle" placeholder="Objective Title">
            <input type="text" id="qTarget" placeholder="Target (e.g. 5$ or 50k, 1m)">
            <div style="display:flex; gap:10px;">
                <button class="btn-system" style="background:var(--mana); color:#000; flex:1; border:none;" onclick="registerQuest(false)">Quest</button>
                <button class="btn-system" style="background:var(--debt-color); color:#fff; flex:1; border:none;" onclick="registerQuest(true)">Debt</button>
            </div>
        </div>

        <div id="questList" style="margin-top:20px;"></div>

        <!-- NEW STATS FOOTER (USD Values) -->
        <div class="stats-footer">
            <!-- 1. PAID DEBTS (ARCHIVED) -->
            <div class="stat-box" style="color:var(--debt-color); border-color:var(--debt-color);">
                <div class="stat-title">PAID DEBTS</div>
                <div class="stat-val" id="countPaidDebts">0</div>
                <div class="stat-sub" id="valPaidDebts">$0.00</div>
            </div>

            <!-- 2. UNPAID DEBTS (ACTIVE) -->
            <div class="stat-box" style="color:var(--future-debt); border-color:var(--future-debt);">
                <div class="stat-title">UNPAID DEBTS</div>
                <div class="stat-val" id="countUnpaidDebts">0</div>
                <div class="stat-sub" id="valUnpaidDebts">$0.00</div>
            </div>

            <!-- 3. COMPLETED QUESTS (ARCHIVED) -->
            <div class="stat-box" style="color:var(--mana); border-color:var(--mana);">
                <div class="stat-title">DONE QUESTS</div>
                <div class="stat-val" id="countDoneQuests">0</div>
                <div class="stat-sub" id="valDoneQuests">$0.00</div>
            </div>
        </div>
    </div>

    <div id="dayView" class="full-view">
        <button class="btn-system" onclick="closeViews()">BACK TO SYSTEM</button>
        <h2 id="dayTitle" style="color:var(--mana); margin-top:20px; border-bottom:1px solid #333; padding-bottom:10px;"></h2>
        
        <div id="dayObjectiveForm" style="background:rgba(255,255,255,0.05); padding:15px; margin-bottom:20px; border:1px solid #333;">
            <div style="font-size:0.6rem; color:#888; margin-bottom:5px;">REGISTER OBJECTIVE FOR THIS DATE</div>
            <input type="text" id="dTitle" placeholder="Title">
            <input type="text" id="dTarget" placeholder="Target">
            <div style="display:flex; gap:10px;">
                <button class="btn-system" style="background:var(--mana); color:#000; flex:1; border:none;" onclick="registerFromDayView(false)">Add Quest</button>
                <button class="btn-system" style="background:var(--debt-color); color:#fff; flex:1; border:none;" onclick="registerFromDayView(true)">Add Debt</button>
            </div>
        </div>

        <h3 style="color:#666; font-size:0.7rem; margin-top:20px;">ARCHIVED / COMPLETED</h3>
        <div id="dayList"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD-j_kXAR8PqOPd1GBEst-sRWZNCpuFM7w",
            authDomain: "my-system-leveling.firebaseapp.com",
            projectId: "my-system-leveling",
            storageBucket: "my-system-leveling.firebasestorage.app",
            messagingSenderId: "894105661320",
            appId: "1:894105661320:web:beb8bdad2d4da8b97a943d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const RATE = 89000;
        let system = { vault: 0, salary: 0, quests: [], dayArchives: {} };
        let navDate = new Date();
        let currentOpenDate = null;
        let currentUser = null;

        // --- AUTH & CLOUD ---
        document.getElementById('loginBtn').onclick = () => signInWithPopup(auth, provider);
        window.logout = () => { if(confirm("Disconnect?")) signOut(auth).then(()=>location.reload()); };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('mainView').style.display = 'block';
                document.getElementById('userEmailDisplay').textContent = user.email;
                
                onSnapshot(doc(db, "users", user.uid), (doc) => {
                    if (doc.exists()) {
                        system = doc.data();
                        render();
                    } else {
                        save();
                    }
                });
            } else {
                document.getElementById('authOverlay').style.display = 'flex';
                document.getElementById('mainView').style.display = 'none';
            }
        });

        async function save() {
            if (currentUser) {
                await setDoc(doc(db, "users", currentUser.uid), system);
            }
        }

        // --- Helper Functions ---
        function parseWish(val) {
            if (!val) return 0;
            val = String(val).toLowerCase().trim();
            if (val.endsWith('$')) return parseFloat(val) * RATE;
            if (val.endsWith('k')) return parseFloat(val) * 1000;
            if (val.endsWith('m')) return parseFloat(val) * 1000000;
            return parseFloat(val) || 0;
        }

        function formatVal(v) {
            if (v >= 1000000) return (v / 1000000).toFixed(2) + "m";
            if (v >= 1000) return (v / 1000).toFixed(1) + "k";
            return Math.floor(v);
        }

        // --- LOCAL DATE FUNCTION (BUG FIX) ---
        function getLocalTodayStr() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // --- RANK LOGIC ---
        function getRankInfo(val) {
            if (val >= 100000000) return { r: 'SS', c: 'var(--rank-ss)' }; 
            if (val >= 50000000) return { r: 'S', c: 'var(--rank-s)' };   
            if (val >= 10000000) return { r: 'A', c: 'var(--rank-a)' };   
            if (val >= 2000000) return { r: 'B', c: 'var(--rank-b)' };    
            if (val >= 400000) return { r: 'C', c: 'var(--rank-c)' };     
            return { r: 'E', c: 'var(--rank-e)' };
        }

        // --- GLOBAL LOGIC ---
        window.addSalary = () => {
            let a = prompt("Add Salary Income (e.g. 500$):");
            if(a) { system.salary = (system.salary || 0) + (parseWish(a) / RATE); save(); }
        };

        window.salaryToVault = () => {
            let a = prompt("Transfer to System (e.g. 50k, 100$):");
            if(!a) return;
            let goldAmount = parseWish(a);
            let costInUSD = goldAmount / RATE;

            if(goldAmount >= 1 && (system.salary || 0) >= costInUSD) {
                system.salary -= costInUSD; 
                distribute(goldAmount); 
            } else {
                alert("Insufficient Salary funds.");
            }
        };

        window.startFlowDeposit = () => { 
            let a = prompt("Deposit Assets (e.g. 50$ or 100k):"); 
            if(a) distribute(parseWish(a)); 
        };

        window.confirmZero = (type) => {
            if(confirm(`Clean up the remaining fraction (less than 1000) from ${type}?`)) {
                if(type === 'salary') system.salary = 0; else system.vault = 0;
                save();
            }
        };

        window.payDebt = (id) => {
            let q = system.quests.find(x => x.id === id);
            if(!q) return;
            let remainingGold = q.target - q.current;
            let costUSD = remainingGold / RATE;

            if((system.salary || 0) >= costUSD) {
                if(confirm(`Pay $${costUSD.toFixed(2)} from SALARY?`)) {
                    system.salary -= costUSD;
                    q.current = q.target;
                    archiveCheck();
                    save();
                }
            } else {
                alert(`Insufficient Salary! Need $${costUSD.toFixed(2)}`);
            }
        };

        function distribute(amount) {
            if(amount < 1) return;
            const today = getLocalTodayStr(); // Using Local Date
            system.quests.sort((a,b) => a.id - b.id);
            for (let q of system.quests) {
                if(q.isDebt) continue; 
                if(q.targetDate > today) continue;
                let needed = q.target - q.current;
                if(needed > 0) {
                    let fill = Math.min(amount, needed);
                    q.current += fill;
                    amount -= fill;
                }
                if(amount <= 0) break;
            }
            if(amount > 0) system.vault = (system.vault || 0) + amount;
            archiveCheck(); save();
        }

        window.registerQuest = (isDebt) => {
            let t = document.getElementById('qTitle').value, g = document.getElementById('qTarget').value;
            if(t && g) {
                const todayStr = getLocalTodayStr(); // Using Local Date
                addObjective(t, g, isDebt, todayStr);
                document.getElementById('qTitle').value = ''; 
                document.getElementById('qTarget').value = '';
            }
        };

        window.registerFromDayView = (isDebt) => {
            let t = document.getElementById('dTitle').value, g = document.getElementById('dTarget').value;
            if(t && g && currentOpenDate) {
                addObjective(t, g, isDebt, currentOpenDate);
                document.getElementById('dTitle').value = ''; 
                document.getElementById('dTarget').value = '';
                alert("Objective Added!");
                closeViews();
            }
        };

        function addObjective(title, target, isDebt, date) {
            system.quests.push({ 
                id: Date.now(), 
                title: title, 
                target: parseWish(target), 
                current: 0, 
                isDebt: isDebt, 
                targetDate: date 
            });
            const today = getLocalTodayStr(); // Using Local Date
            if(!isDebt && date <= today && (system.vault || 0) >= 1) { 
                let v = system.vault; system.vault = 0; distribute(v); 
            } else {
                save();
            }
        }

        window.discardQuest = (id) => {
            let idx = system.quests.findIndex(x => x.id === id);
            if(idx === -1) return;
            let q = system.quests[idx];
            let refundAmount = q.current || 0; 
            system.quests.splice(idx,1);
            if(!q.isDebt && refundAmount > 0) system.vault = (system.vault || 0) + refundAmount;
            save();
        };

        window.globalWithdraw = () => {
            let withdrawableQuests = system.quests.filter(q => !q.isDebt);
            let withdrawableArchived = Object.values(system.dayArchives).flat().filter(q => !q.isDebt);
            let totalAvailable = (system.vault || 0) + 
                                 withdrawableQuests.reduce((s,q)=>s+q.current,0) + 
                                 withdrawableArchived.reduce((s,q)=>s+q.current,0);
            
            let a = prompt(`Withdraw (Max Available: ${formatVal(totalAvailable)}):`);
            if(a) {
                let rem = parseWish(a);
                if(rem > totalAvailable) { alert("Funds tied in Debts cannot be withdrawn."); return; }
                if(rem >= 1000) {
                    if(system.vault >= rem) { system.vault -= rem; rem = 0; }
                    else { rem -= system.vault; system.vault = 0; }
                    if(rem > 0) {
                        let reverseQuests = [...system.quests].reverse();
                        for(let q of reverseQuests) {
                            if(q.isDebt) continue; 
                            if(q.current >= rem) { q.current -= rem; rem = 0; break; }
                            else { rem -= q.current; q.current = 0; }
                        }
                    }
                    if(rem > 0) {
                        let dates = Object.keys(system.dayArchives).sort().reverse();
                        for(let d of dates) {
                            let list = system.dayArchives[d];
                            for(let i=list.length-1; i>=0; i--) {
                                let q = list[i]; if(q.isDebt) continue; 
                                if(q.current >= rem) { q.current -= rem; rem = 0; }
                                else { rem -= q.current; q.current = 0; }
                                if(q.current < q.target) system.quests.unshift(list.splice(i,1)[0]);
                                if(rem <= 0) break;
                            }
                            if(rem <= 0) break;
                        }
                    }
                    save();
                }
            }
        };

        window.deleteArchivedDebt = (date, id) => {
            if(confirm("Permanently purge this Debt record?")) {
                system.dayArchives[date] = system.dayArchives[date].filter(q => q.id !== id);
                if(system.dayArchives[date].length === 0) delete system.dayArchives[date];
                save(); openDay(date);
            }
        };

        function archiveCheck() {
            for(let i=0; i<system.quests.length; i++){
                if(system.quests[i].current >= system.quests[i].target - 0.1){ 
                    let d = system.quests[i].targetDate;
                    if(!system.dayArchives[d]) system.dayArchives[d] = [];
                    system.dayArchives[d].push(system.quests.splice(i,1)[0]);
                    i--;
                }
            }
        }

        // --- RENDER ---
        function render() {
            const todayStr = getLocalTodayStr(); // Using Local Date
            
            // --- WEALTH CALCULATION (Vault + Quests only) ---
            const vaultVal = (system.vault || 0);
            const activeQuestsVal = system.quests.filter(q => !q.isDebt).reduce((s,q)=>s+q.current,0);
            const archivedQuestsVal = Object.values(system.dayArchives).flat().filter(q => !q.isDebt).reduce((s,q)=>s+q.current,0);
            const totalWealth = vaultVal + activeQuestsVal + archivedQuestsVal;

            // --- RANK & LEVEL ---
            const playerRank = getRankInfo(totalWealth);
            const playerLevel = Math.floor(totalWealth / 400000) + 1; 

            // Header Update
            const pBadge = document.getElementById('playerRankBadge');
            pBadge.textContent = "RANK " + playerRank.r;
            pBadge.style.color = playerRank.c;
            pBadge.style.boxShadow = `0 0 10px ${playerRank.c}`;
            document.getElementById('playerLevel').textContent = playerLevel;

            document.getElementById('totalAssets').textContent = formatVal(totalWealth);
            document.getElementById('totalUSD').textContent = `$${(totalWealth/RATE).toLocaleString(undefined, {minimumFractionDigits:2})}`;
            document.getElementById('vaultAmount').textContent = formatVal(system.vault || 0);

            // Salary Update
            document.getElementById('salaryDisplay').textContent = `$${(system.salary || 0).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}`;
            document.getElementById('salaryGoldDisplay').textContent = formatVal((system.salary||0)*RATE);
            
            const salInGold = (system.salary || 0) * RATE;
            document.getElementById('zeroSalary').style.display = (salInGold > 0.1 && salInGold < 1000) ? 'inline-block' : 'none';
            document.getElementById('zeroVault').style.display = (system.vault > 0.1 && system.vault < 1000) ? 'inline-block' : 'none';

            // --- STATS LOGIC UPDATE (USD) ---
            
            // 1. Paid Debts (Archived)
            const archivedDebts = Object.values(system.dayArchives).flat().filter(q => q.isDebt);
            document.getElementById('countPaidDebts').textContent = archivedDebts.length;
            const sumPaid = archivedDebts.reduce((acc,q)=>acc+q.target,0);
            document.getElementById('valPaidDebts').textContent = "$" + (sumPaid / RATE).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

            // 2. Unpaid Debts (Active)
            const activeDebts = system.quests.filter(q => q.isDebt);
            document.getElementById('countUnpaidDebts').textContent = activeDebts.length;
            const sumUnpaid = activeDebts.reduce((acc,q)=>acc+q.target,0);
            document.getElementById('valUnpaidDebts').textContent = "$" + (sumUnpaid / RATE).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

            // 3. Completed Quests (Archived)
            const archivedQuests = Object.values(system.dayArchives).flat().filter(q => !q.isDebt);
            document.getElementById('countDoneQuests').textContent = archivedQuests.length;
            const sumDone = archivedQuests.reduce((acc,q)=>acc+q.target,0);
            document.getElementById('valDoneQuests').textContent = "$" + (sumDone / RATE).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

            // Render List
            const list = document.getElementById('questList'); list.innerHTML = '';
            
            let displayList = [...system.quests].sort((a,b) => {
                if(a.isDebt !== b.isDebt) return a.isDebt ? -1 : 1;
                return new Date(a.targetDate) - new Date(b.targetDate);
            });

            displayList.forEach(q => {
                const perc = (q.current/q.target*100).toFixed(0);
                const isFuture = q.targetDate > todayStr;
                const isLocked = !q.isDebt && isFuture;
                
                let colorVar = '';
                if(isFuture) { colorVar = q.isDebt ? 'var(--future-debt)' : 'var(--future-quest)'; } 
                else { colorVar = q.isDebt ? 'var(--debt-color)' : 'var(--mana)'; }

                let typeLabel = q.isDebt ? 'DEBT' : 'QUEST';
                if(isFuture) typeLabel += ' (FUTURE)';

                let actionButton = '';
                if(q.isDebt) {
                    actionButton = `<button class="btn-pay" onclick="payDebt(${q.id})">PAY & ARCHIVE ($${(q.target/RATE).toFixed(2)})</button>`;
                }

                let rankBadgeHTML = '';
                if(!q.isDebt) {
                    let qRank = getRankInfo(q.target);
                    rankBadgeHTML = `<div class="card-rank-badge" style="color:${qRank.c}">${qRank.r}-RANK</div>`;
                }

                list.innerHTML += `<div class="quest-card ${isLocked?'locked-card':''}" style="border-left: 4px solid ${colorVar}">
                    ${rankBadgeHTML}
                    <div style="font-size:0.6rem; color:#666; display:flex; justify-content:space-between; position:relative; z-index:2;">
                        <span>Target: ${q.targetDate} ${isLocked ? '🔒' : ''}</span>
                        <span style="color:${colorVar}; font-weight:bold;">${typeLabel}</span>
                    </div>
                    <div style="font-weight:bold; color:white; margin:5px 0; position:relative; z-index:2;">${q.title.toUpperCase()}</div>
                    <div style="font-size:0.8rem; font-family:monospace; display:flex; justify-content:space-between; position:relative; z-index:2;">
                        <span>${formatVal(q.current)} / ${formatVal(q.target)}</span>
                        <span>$${(q.target/RATE).toFixed(1)}</span>
                    </div>
                    <div class="progress-container"><div class="progress-fill" style="width:${perc}%; background:${colorVar}"></div></div>
                    ${actionButton}
                    <button class="discard-btn" onclick="discardQuest(${q.id})">Discard</button>
                </div>`;
            });
            drawCalendar();
        }

        function drawCalendar() {
            const grid = document.getElementById('daysGrid'); grid.innerHTML = '';
            document.getElementById('monthTitle').textContent = navDate.toLocaleString('default', {month:'long', year:'numeric'}).toUpperCase();
            
            const todayStr = getLocalTodayStr(); // Using Local Date

            const year = navDate.getFullYear();
            const month = navDate.getMonth();
            const first = new Date(year, month, 1).getDay();
            const last = new Date(year, month+1, 0).getDate();
            
            for(let i=0; i<first; i++) grid.innerHTML += '<div></div>';
            
            for(let i=1; i<=last; i++) {
                const currentDayStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const has = system.dayArchives[currentDayStr] && system.dayArchives[currentDayStr].length > 0;
                const isToday = (currentDayStr === todayStr);

                const cell = document.createElement('div');
                cell.className = `day-cell ${has ? 'has-completed' : ''} ${isToday ? 'today' : ''}`;
                cell.textContent = i; 
                cell.onclick = () => openDay(currentDayStr);
                grid.appendChild(cell);
            }
        }

        window.openDay = (d) => {
            currentOpenDate = d;
            document.getElementById('dayView').style.display = 'block';
            document.getElementById('dayTitle').textContent = d;

            const todayStr = getLocalTodayStr();
            
            const formDiv = document.getElementById('dayObjectiveForm');
            if (d < todayStr) formDiv.style.display = 'none';
            else formDiv.style.display = 'block';

            const l = document.getElementById('dayList'); l.innerHTML = '';
            (system.dayArchives[d] || []).forEach(q => {
                const borderClass = q.isDebt ? 'archive-debt' : 'archive-quest';
                const typeColor = q.isDebt ? 'var(--debt-color)' : 'var(--mana)';
                
                let archiveRank = '';
                if(!q.isDebt) {
                    let r = getRankInfo(q.target);
                    archiveRank = `<span style="color:${r.c}; font-weight:900; font-size:0.7rem; border:1px solid ${r.c}; padding:0 4px; margin-left:5px;">${r.r}</span>`;
                }

                l.innerHTML += `<div class="quest-card ${borderClass}">
                    <div style="font-size:0.65rem; color:${typeColor}; font-weight:bold;">[COMPLETED] ${q.isDebt?'DEBT':'QUEST'} ${archiveRank}</div>
                    <div style="font-weight:bold; margin-top:5px;">${q.title}</div>
                    <div style="font-family:monospace;">Target: ${formatVal(q.target)}</div>
                    ${q.isDebt ? `<button class="discard-btn" onclick="deleteArchivedDebt('${d}', ${q.id})">Purge Record</button>` : ''}
                </div>`;
            });
        };

        window.closeViews = () => document.querySelectorAll('.full-view').forEach(v => v.style.display='none');
        window.changeMonth = (s) => { navDate.setMonth(navDate.getMonth()+s); drawCalendar(); };
        
        // Functions are attached to window for HTML access due to module scope
    </script>
</body>
</html>
