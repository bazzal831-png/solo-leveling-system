<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUNG JIN-WOO SYSTEM | V4.5</title>
    <style>
        :root {
            --bg: #05070b; --panel: rgba(17, 20, 29, 0.9); --mana: #00d2ff;
            --gold: #ffd700; --danger: #ff3131; --text: #e6edf3; --success: #50fa7b;
            --inventory: #ff79c6; --debt-color: #bc13fe;
            --rank-ss: #ffcc00; --rank-s: #ff3131; --rank-a: #bc13fe;
            --rank-b: #00d2ff; --rank-c: #4caf50; --rank-e: #9e9e9e;
        }

        body { 
            background-color: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; 
            background-image: radial-gradient(circle at center, #101525 0%, #05070b 100%);
            -webkit-tap-highlight-color: transparent;
        }

        .system-header { border: 1px solid var(--mana); background: rgba(0, 210, 255, 0.05); padding: 15px; border-radius: 4px; margin-bottom: 20px; position: relative; }
        .user-auth-bar { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--mana); margin-bottom: 10px; border-bottom: 1px solid rgba(0, 210, 255, 0.2); padding-bottom: 5px; }
        .salary-container { border: 1px solid var(--success); background: rgba(80, 250, 123, 0.05); padding: 12px; margin-bottom: 15px; text-align: center; border-radius: 4px; }
        .salary-value { font-size: 1.8rem; color: var(--success); font-weight: bold; font-family: monospace; display: block; }
        
        .gold-main { font-size: 2.4rem; color: var(--gold); display: block; font-weight: bold; text-align: center; margin: 10px 0; font-family: monospace; }
        .btn-system { background: rgba(0, 0, 0, 0.7); border: 1px solid var(--mana); color: var(--mana); padding: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.7rem; }
        .btn-zero { background: var(--danger); color: white; border: none; padding: 5px 10px; font-size: 0.65rem; font-weight: bold; cursor: pointer; border-radius: 3px; margin-top: 8px; display: none; }

        .quest-card { background: var(--panel); border: 1px solid #333; padding: 15px; margin-bottom: 15px; position: relative; clip-path: polygon(0 0, 100% 0, 100% 90%, 95% 100%, 0 100%); }
        .debt-card { border-left: 4px solid var(--debt-color) !important; background: rgba(188, 19, 254, 0.05); }
        .finish-btn { position: absolute; right: 10px; top: 10px; background: var(--success); color: #000; border: none; padding: 5px 10px; font-weight: bold; cursor: pointer; font-size: 0.7rem; z-index: 10; }
        .discard-btn { color: var(--danger); background: none; border: 1px solid rgba(255,49,49,0.2); padding: 3px 8px; font-size: 0.6rem; cursor: pointer; margin-top: 10px; display: inline-block; }

        .progress-container { height: 6px; background: #000; margin-top: 15px; border: 1px solid #222; }
        .progress-fill { height: 100%; transition: width 0.5s; }

        .full-view { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 9999; padding: 20px; overflow-y: auto; }
        input { width: 100%; padding: 15px; margin-bottom: 10px; background: #080a0f; border: 1px solid #333; color: white; box-sizing: border-box; }
        
        .calendar-box { background: var(--panel); padding: 15px; border: 1px solid #222; margin-bottom: 20px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day-cell { aspect-ratio: 1; background: #080a0f; border: 1px solid #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: #444; cursor: pointer; }
        .day-cell.has-completed { border-color: var(--gold); color: var(--gold); }
    </style>
</head>
<body>

    <div id="authOverlay" style="position:fixed; inset:0; background:var(--bg); z-index:50000; display:flex; justify-content:center; align-items:center;">
        <button class="btn-system" id="loginBtn">INITIALIZE SYSTEM ACCESS</button>
    </div>

    <div id="mainView" style="display: none;">
        <div class="salary-container">
            <div style="font-size:0.6rem; color:var(--success); letter-spacing:2px;">RESOURCE: SALARY WALLET</div>
            <span class="salary-value" id="salaryDisplay">$0.00</span>
            <button id="zeroSalary" class="btn-zero" onclick="confirmZero('salary')">Zero Salary Fraction (<1k)</button>
            <div style="display:flex; gap:5px; margin-top:10px;">
                <button class="btn-system" style="border-color:var(--success); color:var(--success); flex:1;" onclick="addSalary()">+ Add Income</button>
                <button class="btn-system" style="border-color:var(--mana); color:var(--mana); flex:1;" onclick="salaryToVault()">Transfer</button>
            </div>
        </div>

        <div class="system-header">
            <div class="user-auth-bar">
                <span id="userEmailDisplay">---</span>
                <span style="color:var(--danger); cursor:pointer;" onclick="logout()">[ DISCONNECT ]</span>
            </div>
            <div class="rank-tag" id="rankDisplay">RANK E</div>
            <span class="gold-main" id="totalAssets">0</span>
            <span id="totalUSD" style="text-align:center; display:block; color:var(--success); font-weight:bold; font-size:1.1rem;">$0.00</span>
        </div>

        <div class="main-actions" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
            <button class="btn-system" onclick="startFlowDeposit()">+ Add Assets</button>
            <button class="btn-system" onclick="openRankView()">Rank Table</button>
            <button class="btn-system" onclick="globalWithdraw()" style="grid-column:span 2; border-color:var(--danger); color:var(--danger);">Withdrawal</button>
        </div>

        <div class="vault-container" style="border:1px solid var(--inventory); padding:12px; text-align:center; margin-bottom:15px;">
            <div style="font-size:0.6rem; color:var(--inventory); letter-spacing:1px;">STORAGE VAULT</div>
            <div id="vaultAmount" style="font-size:1.5rem; color:var(--inventory); font-weight:bold; font-family:monospace;">0</div>
            <button id="zeroVault" class="btn-zero" onclick="confirmZero('vault')">Zero Vault Fraction (<1k)</button>
        </div>

        <div class="calendar-box">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; color:var(--mana); font-size:0.8rem;">
                <button onclick="changeMonth(-1)" style="background:none; border:none; color:inherit; cursor:pointer;">&lt;</button>
                <span id="monthTitle">MONTH</span>
                <button onclick="changeMonth(1)" style="background:none; border:none; color:inherit; cursor:pointer;">&gt;</button>
            </div>
            <div class="days-grid" id="daysGrid"></div>
        </div>

        <div style="background:rgba(0, 210, 255, 0.03); padding:15px; border:1px solid #222;">
            <input type="text" id="qTitle" placeholder="Objective Title">
            <input type="text" id="qTarget" placeholder="Target (e.g. 5$ or 50k)">
            <div style="display:flex; gap:10px;">
                <button class="btn-system" style="background:var(--mana); color:#000; flex:1; border:none;" onclick="registerQuest(false)">Quest</button>
                <button class="btn-system" style="background:var(--debt-color); color:#fff; flex:1; border:none;" onclick="registerQuest(true)">Debt</button>
            </div>
        </div>

        <div id="questList" style="margin-top:20px;"></div>
    </div>

    <div id="dayView" class="full-view">
        <button class="btn-system" onclick="closeViews()">BACK TO SYSTEM</button>
        <h2 id="dayTitle" style="color:var(--mana); margin-top:20px;"></h2>
        <div id="dayList"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyD-j_kXAR8PqOPd1GBEst-sRWZNCpuFM7w", authDomain: "my-system-leveling.firebaseapp.com", projectId: "my-system-leveling", storageBucket: "my-system-leveling.firebasestorage.app", messagingSenderId: "894105661320", appId: "1:894105661320:web:beb8bdad2d4da8b97a943d" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const RATE = 89000;
        let system = { vault: 0, salary: 0, quests: [], dayArchives: {} };
        let currentUser = null;
        let navDate = new Date();

        function parseWish(val) {
            if (!val) return 0;
            val = String(val).toLowerCase().trim();
            if (val.endsWith('$')) return parseFloat(val) * RATE;
            if (val.endsWith('k')) return parseFloat(val) * 1000;
            return parseFloat(val) || 0;
        }

        function formatVal(v) {
            if (v >= 1000000) return (v / 1000000).toFixed(1) + "M";
            if (v >= 1000) return (v / 1000).toFixed(0) + "k";
            return Math.floor(v);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('mainView').style.display = 'block';
                document.getElementById('userEmailDisplay').textContent = user.email;
                onSnapshot(doc(db, "users", user.uid), (d) => { if(d.exists()){ system = d.data(); render(); } else save(); });
            }
        });

        async function save() { if(currentUser) await setDoc(doc(db, "users", currentUser.uid), system); }
        window.logout = () => signOut(auth).then(() => location.reload());
        document.getElementById('loginBtn').onclick = () => signInWithPopup(auth, provider);

        window.addSalary = () => {
            let a = prompt("Add Salary Income (e.g. 500$):");
            if(a) { system.salary = (system.salary || 0) + (parseWish(a) / RATE); save(); }
        };

        window.salaryToVault = () => {
            let a = prompt(`Amount ($) to transfer (Max: $${(system.salary || 0).toFixed(2)}):`);
            if(a && parseFloat(a) >= (1000/RATE) && parseFloat(a) <= system.salary) {
                system.salary -= parseFloat(a);
                distribute(parseFloat(a) * RATE);
            }
        };

        window.confirmZero = (type) => {
            if(confirm(`Wipe the fraction from ${type}?`)) {
                if(type === 'salary') system.salary = 0; else system.vault = 0;
                save();
            }
        };

        function distribute(amount) {
            if(amount < 1) return;
            const today = new Date().toISOString().split('T')[0];
            for (let q of system.quests) {
                if(q.isDebt || q.createdAt > today) continue;
                let needed = q.target - q.current;
                if(needed > 0) {
                    let fill = Math.min(amount, needed);
                    q.current += fill;
                    amount -= fill;
                }
            }
            if(amount > 0) system.vault = (system.vault || 0) + amount;
            archiveCheck(); save();
        }

        window.registerQuest = (isDebt) => {
            let t = document.getElementById('qTitle').value, g = document.getElementById('qTarget').value;
            if(t && g) {
                system.quests.push({ id: Date.now(), title: t, target: parseWish(g), current: 0, isDebt: isDebt, createdAt: new Date().toISOString().split('T')[0] });
                document.getElementById('qTitle').value = ''; document.getElementById('qTarget').value = '';
                if(!isDebt && (system.vault || 0) >= 1000) { let v = system.vault; system.vault = 0; distribute(v); }
                else save();
            }
        };

        window.finishDebt = (id) => {
            let q = system.quests.find(x => x.id === id);
            let costUSD = q.target / RATE;
            if(system.salary >= costUSD) {
                if(confirm(`Pay $${costUSD.toFixed(2)} to clear?`)) { system.salary -= costUSD; q.current = q.target; archiveCheck(); save(); }
            }
        };

        window.discardQuest = (id) => {
            let idx = system.quests.findIndex(x => x.id === id);
            let q = system.quests[idx];
            // Rule: Debt doesn't refund, Quests do.
            if(!q.isDebt && q.current >= 1000) { 
                let refund = q.current; system.quests.splice(idx,1); distribute(refund); 
            } else { system.quests.splice(idx,1); save(); }
        };

        // Old System Withdrawal (Back and forth)
        window.globalWithdraw = () => {
            let normalQuests = system.quests.filter(q => !q.isDebt);
            let archived = Object.values(system.dayArchives).flat().filter(q => !q.isDebt);
            let total = (system.vault || 0) + normalQuests.reduce((s,q)=>s+q.current,0) + archived.reduce((s,q)=>s+q.current,0);
            
            let a = prompt(`Withdraw (Max ${formatVal(total)}):`);
            if(a) {
                let rem = parseWish(a);
                if(rem >= 1000 && rem <= total) {
                    // 1. Vault
                    if(system.vault >= rem) { system.vault -= rem; rem = 0; }
                    else { rem -= system.vault; system.vault = 0; }
                    // 2. Active Quests
                    if(rem > 0) {
                        for(let i=system.quests.length-1; i>=0; i--) {
                            let q = system.quests[i]; if(q.isDebt) continue;
                            if(q.current >= rem) { q.current -= rem; rem = 0; break; }
                            else { rem -= q.current; q.current = 0; }
                        }
                    }
                    // 3. Archives (Pull back)
                    if(rem > 0) {
                        let dates = Object.keys(system.dayArchives).sort().reverse();
                        for(let d of dates) {
                            let list = system.dayArchives[d];
                            for(let i=list.length-1; i>=0; i--) {
                                let q = list[i]; if(q.isDebt) continue;
                                if(q.current >= rem) { q.current -= rem; rem = 0; }
                                else { rem -= q.current; q.current = 0; }
                                if(q.current < q.target) system.quests.unshift(list.splice(i,1)[0]);
                                if(rem <= 0) break;
                            }
                            if(rem <= 0) break;
                        }
                    }
                    save();
                }
            }
        };

        window.deleteArchivedDebt = (date, id) => {
            if(confirm("Permanently delete this Debt record? (No refund)")) {
                system.dayArchives[date] = system.dayArchives[date].filter(q => q.id !== id);
                save(); openDay(date);
            }
        };

        function archiveCheck() {
            for(let i=0; i<system.quests.length; i++){
                if(system.quests[i].current >= system.quests[i].target){
                    let d = system.quests[i].createdAt;
                    if(!system.dayArchives[d]) system.dayArchives[d] = [];
                    system.dayArchives[d].push(system.quests.splice(i,1)[0]);
                    i--;
                }
            }
        }

        function render() {
            const normalQuests = system.quests.filter(q => !q.isDebt);
            const archived = Object.values(system.dayArchives).flat().filter(q => !q.isDebt);
            const total = normalQuests.reduce((s,q)=>s+q.current,0) + archived.reduce((s,q)=>s+q.current,0) + (system.vault || 0);

            document.getElementById('salaryDisplay').textContent = `$${(system.salary || 0).toFixed(2)}`;
            document.getElementById('totalAssets').textContent = formatVal(total);
            document.getElementById('totalUSD').textContent = `$${(total/RATE).toLocaleString(undefined, {minimumFractionDigits:2})}`;
            document.getElementById('vaultAmount').textContent = formatVal(system.vault || 0);

            // FIX: Zero Salary Fraction Visibility (Check against gold equivalent)
            const salInGold = (system.salary || 0) * RATE;
            document.getElementById('zeroSalary').style.display = (salInGold > 0 && salInGold < 1000) ? 'inline-block' : 'none';
            document.getElementById('zeroVault').style.display = (system.vault > 0 && system.vault < 1000) ? 'inline-block' : 'none';

            const list = document.getElementById('questList'); list.innerHTML = '';
            system.quests.forEach(q => {
                const perc = (q.current/q.target*100).toFixed(0);
                list.innerHTML += `<div class="quest-card ${q.isDebt?'debt-card':''}">
                    ${q.isDebt && q.current < q.target ? `<button class="finish-btn" onclick="finishDebt(${q.id})">FINISH</button>` : ''}
                    <div style="font-size:0.6rem; color:#666;">${q.createdAt}</div>
                    <div style="font-weight:bold; color:white;">${q.title}</div>
                    <div style="font-size:0.8rem; font-family:monospace; display:flex; justify-content:space-between;">
                        <span>${formatVal(q.current)} / ${formatVal(q.target)}</span>
                        <span>$${(q.target/RATE).toFixed(1)}</span>
                    </div>
                    <div class="progress-container"><div class="progress-fill" style="width:${perc}%; background:${q.isDebt?'var(--debt-color)':'var(--mana)'}"></div></div>
                    <button class="discard-btn" onclick="discardQuest(${q.id})">Discard</button>
                </div>`;
            });
            drawCalendar();
        }

        function drawCalendar() {
            const grid = document.getElementById('daysGrid'); grid.innerHTML = '';
            document.getElementById('monthTitle').textContent = navDate.toLocaleString('default', {month:'long', year:'numeric'}).toUpperCase();
            const first = new Date(navDate.getFullYear(), navDate.getMonth(), 1).getDay();
            const last = new Date(navDate.getFullYear(), navDate.getMonth()+1, 0).getDate();
            for(let i=0; i<first; i++) grid.innerHTML += '<div></div>';
            for(let i=1; i<=last; i++) {
                const dk = `${navDate.getFullYear()}-${String(navDate.getMonth()+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const has = system.dayArchives[dk] && system.dayArchives[dk].length > 0;
                const cell = document.createElement('div');
                cell.className = `day-cell ${has?'has-completed':''}`;
                cell.textContent = i; cell.onclick = () => openDay(dk);
                grid.appendChild(cell);
            }
        }

        window.openDay = (d) => {
            document.getElementById('dayView').style.display = 'block';
            document.getElementById('dayTitle').textContent = d;
            const l = document.getElementById('dayList'); l.innerHTML = '';
            (system.dayArchives[d] || []).forEach(q => {
                l.innerHTML += `<div class="quest-card ${q.isDebt?'debt-card':''}">
                    <div class="quest-title">${q.isDebt?'💀 DEBT':'🏆 QUEST'}: ${q.title}</div>
                    <div>Target: ${formatVal(q.target)}</div>
                    ${q.isDebt ? `<button class="discard-btn" onclick="deleteArchivedDebt('${d}', ${q.id})">Delete Debt Record</button>` : ''}
                </div>`;
            });
        };

        window.closeViews = () => document.querySelectorAll('.full-view').forEach(v => v.style.display='none');
        window.changeMonth = (s) => { navDate.setMonth(navDate.getMonth()+s); drawCalendar(); };
        window.startFlowDeposit = () => { let a = prompt("Deposit Assets (e.g. 50$ or 100k):"); if(a) distribute(parseWish(a)); };
    </script>
</body>
</html>
