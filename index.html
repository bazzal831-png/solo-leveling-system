<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUNG JIN-WOO SYSTEM | V5.0</title>
    <style>
        :root {
            --bg: #05070b; --panel: rgba(17, 20, 29, 0.9); --mana: #00d2ff;
            --gold: #ffd700; --danger: #ff3131; --text: #e6edf3; --success: #50fa7b;
            --inventory: #ff79c6; --debt-color: #bc13fe;
            --rank-ss: #ffcc00; --rank-s: #ff3131; --rank-a: #bc13fe;
            --rank-b: #00d2ff; --rank-c: #4caf50; --rank-e: #9e9e9e;
        }

        body { 
            background-color: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; 
            background-image: radial-gradient(circle at center, #101525 0%, #05070b 100%);
            -webkit-tap-highlight-color: transparent; overflow-x: hidden;
        }

        .system-header { border: 1px solid var(--mana); background: rgba(0, 210, 255, 0.05); padding: 15px; border-radius: 4px; margin-bottom: 20px; position: relative; }
        .user-auth-bar { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--mana); margin-bottom: 10px; border-bottom: 1px solid rgba(0, 210, 255, 0.2); padding-bottom: 5px; }
        
        .salary-container { border: 1px solid var(--success); background: rgba(80, 250, 123, 0.05); padding: 12px; margin-bottom: 15px; text-align: center; border-radius: 4px; }
        .salary-value { font-size: 1.8rem; color: var(--success); font-weight: bold; font-family: monospace; display: block; }
        
        .gold-main { font-size: 2.6rem; color: var(--gold); display: block; font-weight: bold; text-align: center; margin: 10px 0; font-family: monospace; text-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .usd-sub { font-size: 1.1rem; color: var(--success); text-align: center; display: block; font-weight: bold; margin-bottom: 10px; }

        .btn-system { background: rgba(0, 0, 0, 0.7); border: 1px solid var(--mana); color: var(--mana); padding: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.7rem; width: 100%; transition: 0.2s; }
        .btn-system:active { background: var(--mana); color: #000; }
        .btn-zero { background: var(--danger); color: white; border: none; padding: 5px 10px; font-size: 0.65rem; font-weight: bold; cursor: pointer; border-radius: 3px; margin-top: 8px; display: none; }

        .quest-card { background: var(--panel); border: 1px solid #333; padding: 18px; margin-bottom: 15px; position: relative; clip-path: polygon(0 0, 100% 0, 100% 90%, 95% 100%, 0 100%); }
        .debt-card { border-left: 4px solid var(--debt-color) !important; background: rgba(188, 19, 254, 0.05); }
        .rank-badge-card { font-weight: 900; font-style: italic; font-size: 1.8rem; opacity: 0.1; position: absolute; right: 15px; bottom: 10px; pointer-events: none; }
        .finish-btn { position: absolute; right: 10px; top: 10px; background: var(--success); color: #000; border: none; padding: 5px 10px; font-weight: bold; cursor: pointer; font-size: 0.65rem; z-index: 10; }
        .discard-btn { color: var(--danger); background: none; border: 1px solid rgba(255,49,49,0.2); padding: 3px 8px; font-size: 0.6rem; cursor: pointer; margin-top: 10px; display: inline-block; }

        .progress-container { height: 6px; background: #000; margin-top: 15px; border: 1px solid #222; }
        .progress-fill { height: 100%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }

        .calendar-box { background: var(--panel); padding: 15px; border: 1px solid #222; margin-bottom: 20px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day-cell { aspect-ratio: 1; background: #080a0f; border: 1px solid #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #444; cursor: pointer; }
        .day-cell.has-completed { border-color: var(--gold); color: var(--gold); }

        .full-view { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 9999; padding: 20px; overflow-y: auto; box-sizing: border-box; }
        input { width: 100%; padding: 15px; margin-bottom: 12px; background: #080a0f; border: 1px solid #333; color: white; box-sizing: border-box; }
        
        .archive-stat { text-align: center; color: #555; font-size: 0.65rem; margin-top: 30px; padding: 15px; border-top: 1px solid #222; letter-spacing: 2px; line-height: 2; }
    </style>
</head>
<body>

    <div id="authOverlay" style="position:fixed; inset:0; background:var(--bg); z-index:50000; display:flex; justify-content:center; align-items:center;">
        <button class="btn-system" id="loginBtn" style="width: auto; padding: 20px 40px;">INITIALIZE SYSTEM ACCESS</button>
    </div>

    <div id="mainView" style="display: none;">
        <div class="salary-container">
            <div style="font-size:0.6rem; color:var(--success); letter-spacing:2px;">RESOURCE: SALARY WALLET</div>
            <span class="salary-value" id="salaryDisplay">$0.00</span>
            <button id="zeroSalary" class="btn-zero" onclick="confirmZero('salary')">Zero Salary Fraction</button>
            <div style="display:flex; gap:8px; margin-top:10px;">
                <button class="btn-system" style="border-color:var(--success); color:var(--success); flex:1;" onclick="addSalary()">+ Income</button>
                <button class="btn-system" style="border-color:var(--mana); color:var(--mana); flex:1;" onclick="salaryToVault()">Transfer</button>
            </div>
        </div>

        <div class="system-header">
            <div class="user-auth-bar">
                <span id="userEmailDisplay">---</span>
                <span style="color:var(--danger); cursor:pointer;" onclick="logout()">[ DISCONNECT ]</span>
            </div>
            <div class="rank-tag" id="playerRankDisplay" style="position:absolute; top:-10px; right:10px; background:var(--bg); border:1px solid var(--mana); padding:3px 12px; font-size:0.75rem;">RANK E</div>
            <span class="gold-main" id="totalAssets">0</span>
            <span class="usd-sub" id="totalUSD">$0.00</span>
        </div>

        <div class="main-actions" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
            <button class="btn-system" onclick="startFlowDeposit()">+ Add Assets</button>
            <button class="btn-system" onclick="openFullRankView()">Rank Table</button>
            <button class="btn-system" onclick="globalWithdraw()" style="grid-column:span 2; border-color:var(--danger); color:var(--danger);">Withdrawal</button>
        </div>

        <div class="vault-container" style="border:1px solid var(--inventory); padding:12px; text-align:center; margin-bottom:15px; background:rgba(255,121,198,0.05);">
            <div style="font-size:0.6rem; color:var(--inventory); letter-spacing:2px;">STORAGE VAULT</div>
            <div id="vaultAmount" style="font-size:1.6rem; color:var(--inventory); font-weight:bold; font-family:monospace;">0</div>
            <button id="zeroVault" class="btn-zero" onclick="confirmZero('vault')">Zero Vault Fraction</button>
        </div>

        <div class="calendar-box">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px; align-items:center;">
                <button onclick="changeMonth(-1)" style="background:none; border:none; color:var(--mana);">&lt;</button>
                <div id="monthTitle" style="font-size:0.8rem; color:var(--mana); font-weight:bold;">MONTH</div>
                <button onclick="changeMonth(1)" style="background:none; border:none; color:var(--mana);">&gt;</button>
            </div>
            <div class="days-grid" id="daysGrid"></div>
        </div>

        <div style="background:rgba(0, 210, 255, 0.03); padding:20px; border:1px solid #222;">
            <input type="text" id="qTitle" placeholder="Objective Title">
            <input type="text" id="qTarget" placeholder="Target (e.g. 5$, 100k, 1m)">
            <div style="display:flex; gap:10px;">
                <button class="btn-system" style="background:var(--mana); color:#000; flex:1; border:none;" onclick="registerQuest(false)">Accept Quest</button>
                <button class="btn-system" style="background:var(--debt-color); color:#fff; flex:1; border:none;" onclick="registerQuest(true)">Record Debt</button>
            </div>
        </div>

        <div id="questList" style="margin-top:20px;"></div>

        <div class="archive-stat" id="archiveSplitDisplay">
            ARCHIVED: 0 QUESTS | 0 DEBTS
        </div>
    </div>

    <div id="dayView" class="full-view">
        <button class="btn-system" onclick="closeViews()" style="width:auto; margin-bottom:20px;">[ BACK ]</button>
        <h2 id="dayTitle" style="color:var(--mana);"></h2>
        <div id="dayList"></div>
    </div>

    <div id="rankView" class="full-view">
        <button class="btn-system" onclick="closeViews()" style="width:auto; margin-bottom:20px;">[ BACK ]</button>
        <h2 style="color:var(--gold);">RANKING CLASSIFICATION</h2>
        <div style="line-height: 3; font-size: 1rem; color: #ddd; font-family: monospace;">
            <b style="color:var(--rank-ss)">[SS] SOVEREIGN</b> (> 100M)<br>
            <b style="color:var(--rank-s)">[S] NATIONAL</b> (50M - 100M)<br>
            <b style="color:var(--rank-a)">[A] HIGH HUNTER</b> (10M - 50M)<br>
            <b style="color:var(--rank-b)">[B] INTERMEDIATE</b> (2M - 10M)<br>
            <b style="color:var(--rank-c)">[C] STANDARD</b> (400k - 2M)<br>
            <b style="color:var(--rank-e)">[E] WEAKEST</b> (< 400k)
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyD-j_kXAR8PqOPd1GBEst-sRWZNCpuFM7w", authDomain: "my-system-leveling.firebaseapp.com", projectId: "my-system-leveling", storageBucket: "my-system-leveling.firebasestorage.app", messagingSenderId: "894105661320", appId: "1:894105661320:web:beb8bdad2d4da8b97a943d" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const RATE = 89000;
        let system = { vault: 0, salary: 0, quests: [], dayArchives: {} };
        let currentUser = null;
        let navDate = new Date();

        function parseWish(val) {
            if (!val) return 0;
            val = String(val).toLowerCase().trim();
            if (val.endsWith('$')) return parseFloat(val) * RATE;
            if (val.endsWith('k')) return parseFloat(val) * 1000;
            if (val.endsWith('m')) return parseFloat(val) * 1000000;
            return parseFloat(val) || 0;
        }

        function formatVal(v) {
            if (v >= 1000000) return (v / 1000000).toFixed(2) + "m";
            if (v >= 1000) return (v / 1000).toFixed(1) + "k";
            return Math.floor(v);
        }

        function getRank(val) {
            if (val >= 100000000) return 'SS';
            if (val >= 50000000) return 'S';
            if (val >= 10000000) return 'A';
            if (val >= 2000000) return 'B';
            if (val >= 400000) return 'C';
            return 'E';
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('mainView').style.display = 'block';
                document.getElementById('userEmailDisplay').textContent = user.email.toLowerCase();
                onSnapshot(doc(db, "users", user.uid), (d) => { if(d.exists()){ system = d.data(); render(); } else save(); });
            }
        });

        async function save() { if(currentUser) await setDoc(doc(db, "users", currentUser.uid), system); }
        window.logout = () => signOut(auth).then(() => location.reload());
        document.getElementById('loginBtn').onclick = () => signInWithPopup(auth, provider);

        window.addSalary = () => {
            let a = prompt("Add Salary Income (e.g. 100$):");
            if(a) { system.salary = (system.salary || 0) + (parseWish(a) / RATE); save(); }
        };

        window.salaryToVault = () => {
            let a = prompt("Amount to transfer (e.g. 50k, 10$):");
            if(!a) return;
            let gold = parseWish(a);
            if(gold >= 1000 && (system.salary * RATE) >= (gold - 1)) {
                system.salary -= (gold / RATE); distribute(gold);
            } else alert("Insufficient salary.");
        };

        function distribute(amount) {
            const today = new Date().toISOString().split('T')[0];
            for (let q of system.quests) {
                if(q.isDebt || q.createdAt > today) continue;
                let needed = q.target - q.current;
                if(needed > 0) {
                    let fill = Math.min(amount, needed);
                    q.current += fill;
                    amount -= fill;
                }
            }
            if(amount > 0) system.vault = (system.vault || 0) + amount;
            archiveCheck(); save();
        }

        window.registerQuest = (isDebt) => {
            let t = document.getElementById('qTitle').value, g = document.getElementById('qTarget').value;
            if(t && g) {
                system.quests.push({ id: Date.now(), title: t, target: parseWish(g), current: 0, isDebt: isDebt, createdAt: new Date().toISOString().split('T')[0] });
                document.getElementById('qTitle').value = ''; document.getElementById('qTarget').value = '';
                if(!isDebt && (system.vault || 0) >= 1000) { let v = system.vault; system.vault = 0; distribute(v); }
                else save();
            }
        };

        window.finishDebt = (id) => {
            let q = system.quests.find(x => x.id === id);
            let costUSD = q.target / RATE;
            if(system.salary >= (costUSD - 0.0001)) {
                if(confirm("Clear this debt?")) { system.salary -= costUSD; q.current = q.target; archiveCheck(); save(); }
            } else alert("Insufficient salary.");
        };

        // حذف المهمات/الديون النشطة
        window.discardQuest = (id) => {
            if(!confirm("Discard this objective?")) return;
            let idx = system.quests.findIndex(x => x.id === id);
            let q = system.quests[idx];
            if(!q.isDebt && q.current > 0) system.vault = (system.vault || 0) + q.current;
            system.quests.splice(idx, 1); save();
        };

        // حذف من الأرشيف
        window.deleteFromArchive = (date, id) => {
            if(!confirm("Delete this record from history?")) return;
            let idx = system.dayArchives[date].findIndex(x => x.id === id);
            system.dayArchives[date].splice(idx, 1);
            if(system.dayArchives[date].length === 0) delete system.dayArchives[date];
            save(); openDay(date); // تحديث واجهة اليوم بعد الحذف
        };

        window.confirmZero = (type) => {
            if(confirm(`Erase fraction from ${type}?`)) {
                if(type === 'salary') system.salary = 0; else system.vault = 0;
                save();
            }
        };

        function archiveCheck() {
            for(let i=0; i<system.quests.length; i++){
                if(system.quests[i].current >= system.quests[i].target){
                    let d = system.quests[i].createdAt;
                    if(!system.dayArchives[d]) system.dayArchives[d] = [];
                    system.dayArchives[d].push(system.quests.splice(i,1)[0]);
                    i--;
                }
            }
        }

        function render() {
            const todayStr = new Date().toISOString().split('T')[0];
            const normalQuests = system.quests.filter(q => !q.isDebt);
            const allArchived = Object.values(system.dayArchives).flat();
            const arcQuests = allArchived.filter(q => !q.isDebt).length;
            const arcDebts = allArchived.filter(q => q.isDebt).length;
            
            const totalGold = (system.vault || 0) + normalQuests.reduce((s,q)=>s+q.current,0) + allArchived.filter(q=>!q.isDebt).reduce((s,q)=>s+q.current,0);

            document.getElementById('salaryDisplay').textContent = `$${(system.salary || 0).toLocaleString(undefined, {minimumFractionDigits:2})}`;
            document.getElementById('totalAssets').textContent = formatVal(totalGold);
            document.getElementById('totalUSD').textContent = `$${(totalGold/RATE).toLocaleString(undefined, {minimumFractionDigits:2})}`;
            document.getElementById('vaultAmount').textContent = formatVal(system.vault || 0);
            
            const globalRank = getRank(totalGold);
            const rTag = document.getElementById('playerRankDisplay');
            rTag.textContent = "RANK " + globalRank;
            rTag.style.color = `var(--rank-${globalRank.toLowerCase()})`;
            rTag.style.borderColor = `var(--rank-${globalRank.toLowerCase()})`;

            document.getElementById('archiveSplitDisplay').innerHTML = `ARCHIVED: ${arcQuests} QUESTS | ${arcDebts} DEBTS`;

            document.getElementById('zeroSalary').style.display = ((system.salary*RATE) > 0.1 && (system.salary*RATE) < 1000) ? 'inline-block' : 'none';
            document.getElementById('zeroVault').style.display = (system.vault > 0.1 && system.vault < 1000) ? 'inline-block' : 'none';

            const list = document.getElementById('questList'); list.innerHTML = '';
            system.quests.forEach(q => {
                const perc = Math.min(100, (q.current/q.target*100)).toFixed(0);
                const r = getRank(q.target);
                const isLocked = q.createdAt > todayStr;
                list.innerHTML += `<div class="quest-card ${q.isDebt?'debt-card':''}" style="${!q.isDebt?'border-left:4px solid var(--rank-'+r.toLowerCase()+')':''}; ${isLocked?'opacity:0.4;':''}">
                    ${q.isDebt ? `<button class="finish-btn" onclick="finishDebt(${q.id})">PAY</button>` : ''}
                    <div class="rank-badge-card" style="color: var(--rank-${q.isDebt?'e':r.toLowerCase()})">${q.isDebt?'DEBT':r}</div>
                    <div style="font-size:0.6rem; color:#666;">${q.createdAt}</div>
                    <div style="font-weight:bold; color:white;">${q.isDebt?'💀':''} ${q.title}</div>
                    <div style="font-size:0.8rem; font-family:monospace; display:flex; justify-content:space-between;">
                        <span>${formatVal(q.current)} / ${formatVal(q.target)}</span>
                        <span>$${(q.target/RATE).toFixed(2)}</span>
                    </div>
                    <div class="progress-container"><div class="progress-fill" style="width:${perc}%; background:${q.isDebt?'var(--debt-color)':'var(--rank-'+r.toLowerCase()+')'}"></div></div>
                    <button class="discard-btn" onclick="discardQuest(${q.id})">Discard</button>
                </div>`;
            });
            drawCalendar();
        }

        function drawCalendar() {
            const grid = document.getElementById('daysGrid'); grid.innerHTML = '';
            document.getElementById('monthTitle').textContent = navDate.toLocaleString('default', {month:'long', year:'numeric'}).toUpperCase();
            const first = new Date(navDate.getFullYear(), navDate.getMonth(), 1).getDay();
            const last = new Date(navDate.getFullYear(), navDate.getMonth()+1, 0).getDate();
            for(let i=0; i<first; i++) grid.innerHTML += '<div></div>';
            for(let i=1; i<=last; i++) {
                const dk = `${navDate.getFullYear()}-${String(navDate.getMonth()+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const has = system.dayArchives[dk] && system.dayArchives[dk].length > 0;
                const cell = document.createElement('div');
                cell.className = `day-cell ${has?'has-completed':''}`;
                if(new Date().toISOString().split('T')[0] === dk) cell.style.borderColor = "var(--mana)";
                cell.textContent = i; cell.onclick = () => openDay(dk);
                grid.appendChild(cell);
            }
        }

        window.openDay = (d) => {
            if(!system.dayArchives[d] || system.dayArchives[d].length === 0) { alert("Empty archive."); return; }
            document.getElementById('dayView').style.display = 'block';
            document.getElementById('dayTitle').textContent = d;
            const l = document.getElementById('dayList'); l.innerHTML = '';
            system.dayArchives[d].forEach(q => {
                l.innerHTML += `<div class="quest-card ${q.isDebt?'debt-card':''}">
                    <div style="font-weight:bold; color:white;">${q.isDebt?'💀 DEBT':'🏆 QUEST'}: ${q.title}</div>
                    <div style="font-size:0.8rem; color:#888;">Value: ${formatVal(q.target)}</div>
                    <button class="discard-btn" onclick="deleteFromArchive('${d}', ${q.id})">Delete Record</button>
                </div>`;
            });
        };

        window.openFullRankView = () => document.getElementById('rankView').style.display='block';
        window.closeViews = () => { document.getElementById('dayView').style.display='none'; document.getElementById('rankView').style.display='none'; };
        window.changeMonth = (s) => { navDate.setMonth(navDate.getMonth()+s); drawCalendar(); };
        window.startFlowDeposit = () => { let a = prompt("Add Gold (e.g. 100k, 5$):"); if(a) distribute(parseWish(a)); };
        window.globalWithdraw = () => { alert("Withdrawal feature active in vault logic."); };

    </script>
</body>
</html>
