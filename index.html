<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DAILY QUEST | SUNG JIN-WOO SYSTEM</title>
    
    <link rel="manifest" href="/solo-leveling-system/manifest.json">
    <meta name="theme-color" content="#00d2ff">

    <style>
        :root {
            --bg: #05070b; --panel: rgba(17, 20, 29, 0.9); --mana: #00d2ff;
            --gold: #ffd700; --danger: #ff3131; --text: #e6edf3; --success: #50fa7b;
            --inventory: #ff79c6;
            --rank-ss: #ffcc00; --rank-s: #ff3131; --rank-a: #bc13fe;
            --rank-b: #00d2ff; --rank-c: #4caf50; --rank-e: #9e9e9e;
        }

        body { 
            background-color: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; 
            overflow-x: hidden; background-image: radial-gradient(circle at center, #101525 0%, #05070b 100%);
        }

        /* --- AUTH SCREEN --- */
        #authOverlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 50000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .login-card {
            width: 85%; max-width: 400px; border: 1px solid var(--mana);
            padding: 40px 20px; text-align: center; background: rgba(0, 30, 50, 0.3);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.1);
        }

        /* --- SYSTEM BLUE SCREEN --- */
        #systemNotice {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 5, 15, 0.9); backdrop-filter: blur(8px);
            z-index: 20000; justify-content: center; align-items: center;
        }
        .notice-window {
            width: 85%; border: 2px solid var(--mana); background: rgba(0, 30, 50, 0.95);
            padding: 35px 20px; box-shadow: 0 0 60px rgba(0, 210, 255, 0.5);
            text-align: center; animation: noticePop 0.3s cubic-bezier(0.17, 0.89, 0.32, 1.28);
        }
        .notice-header { color: var(--mana); font-size: 0.8rem; letter-spacing: 5px; border-bottom: 1px solid var(--mana); padding-bottom: 10px; margin-bottom: 20px; text-transform: uppercase; }
        .notice-body { color: #fff; font-size: 1.2rem; font-weight: 900; line-height: 1.5; text-shadow: 0 0 10px var(--mana); }

        @keyframes noticePop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- TOP HEADER DESIGN --- */
        .system-header {
            border: 1px solid var(--mana); background: rgba(0, 210, 255, 0.05);
            padding: 15px; border-radius: 4px; margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(0, 210, 255, 0.1); position: relative;
        }
        .top-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .player-meta { display: flex; flex-direction: column; }
        .name-box { font-size: 1.1rem; font-weight: 900; color: #fff; text-shadow: 0 0 10px var(--mana); }
        .rank-tag-header { font-size: 0.7rem; color: var(--mana); font-weight: bold; letter-spacing: 2px; border: 1px solid var(--mana); padding: 2px 8px; width: fit-content; margin-top: 5px; }
        
        .logout-btn {
            background: rgba(255, 49, 49, 0.1); border: 1px solid var(--danger);
            color: var(--danger); padding: 5px 12px; font-size: 0.65rem; font-weight: bold;
            cursor: pointer; letter-spacing: 1px;
        }

        .stats-display { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid rgba(0, 210, 255, 0.2); padding-top: 10px; }
        .gold-main { font-size: 2.4rem; color: var(--gold); font-weight: bold; font-family: monospace; }
        .usd-sub { font-size: 1rem; color: var(--success); font-weight: bold; text-align: right; }
        .lvl-text { color: var(--mana); font-size: 0.8rem; font-weight: bold; }

        /* --- REST OF STYLES (SAME AS PREVIOUS) --- */
        .main-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn-system { background: rgba(0, 0, 0, 0.7); border: 1px solid var(--mana); color: var(--mana); padding: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
        .btn-withdraw { border-color: var(--danger); color: var(--danger); grid-column: span 2; }
        .vault-container { border: 1px solid var(--inventory); background: rgba(255, 121, 198, 0.05); padding: 12px; text-align: center; margin-bottom: 15px; }
        .quest-card { background: var(--panel); border: 1px solid #333; padding: 18px; margin-bottom: 15px; position: relative; clip-path: polygon(0 0, 100% 0, 100% 88%, 96% 100%, 0 100%); }
        .quest-locked { opacity: 0.3; filter: grayscale(1); }
        .quest-title { font-weight: 900; color: #fff; margin-bottom: 10px; text-transform: uppercase; }
        .progress-container { height: 6px; background: #000; margin: 15px 0 5px 0; border: 1px solid #222; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 1s; box-shadow: 0 0 15px var(--mana); }
        .calendar-box { background: var(--panel); padding: 15px; border: 1px solid #222; margin-bottom: 20px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .day-cell { aspect-ratio: 1; background: #080a0f; border: 1px solid #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; cursor: pointer; }
        .day-cell.has-completed { border-color: var(--gold); color: var(--gold); }
        .day-cell.today { border-color: var(--mana); color: var(--mana); box-shadow: inset 0 0 5px var(--mana); }
        .full-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; padding: 20px; overflow-y: auto; }
        .back-btn { color: var(--mana); border: 1px solid var(--mana); padding: 10px 20px; display: inline-block; cursor: pointer; margin-bottom: 25px; font-size: 0.8rem; }
        input { width: 100%; padding: 15px; margin-bottom: 12px; background: #080a0f; border: 1px solid #333; color: white; font-size: 1rem; }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="login-card">
            <div class="notice-header">SYSTEM AUTHENTICATION</div>
            <button class="btn-system" id="loginBtn" style="background: white; color: black; border: none; margin-top: 20px;">IDENTIFY PLAYER (GOOGLE)</button>
        </div>
    </div>

    <div id="systemNotice">
        <div class="notice-window">
            <div class="notice-header">SYSTEM NOTIFICATION</div>
            <div class="notice-body" id="noticeMsg">---</div>
        </div>
    </div>

    <div id="mainView" style="display: none;">
        <div class="system-header">
            <div class="top-row">
                <div class="player-meta">
                    <div class="name-box" id="displayUserName">PLAYER</div>
                    <div class="rank-tag-header" id="playerRankDisplay">RANK E</div>
                </div>
                <button class="logout-btn" onclick="logout()">LOGOUT</button>
            </div>
            <div class="stats-display">
                <div>
                    <div class="lvl-text">LEVEL <span id="mainLvl">1</span></div>
                    <div class="gold-main" id="totalAssets">0</div>
                </div>
                <div class="usd-sub" id="totalUSD">$0.00</div>
            </div>
        </div>

        <div class="main-actions">
            <button class="btn-system" onclick="startFlowDeposit()">+ Add Assets</button>
            <button class="btn-system" onclick="openFullRankView()">Rank Table</button>
            <button class="btn-system btn-withdraw" onclick="globalWithdraw()">Global Withdrawal</button>
        </div>

        <div class="vault-container">
            <div style="font-size: 0.6rem; color: var(--inventory); letter-spacing: 3px; margin-bottom: 5px;">INVENTORY / VAULT</div>
            <div id="vaultAmount" style="color: var(--inventory); font-weight: bold; font-size: 1.3rem; font-family: monospace;">0</div>
        </div>

        <div class="calendar-box">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px; align-items:center;">
                <button onclick="changeMonth(-1)" style="background:none; border:none; color:var(--mana);">&lt;</button>
                <div id="monthDisplay" style="font-size:0.8rem; letter-spacing:2px; color: var(--mana);">MONTH</div>
                <button onclick="changeMonth(1)" style="background:none; border:none; color:var(--mana);">&gt;</button>
            </div>
            <div class="days-grid" id="daysGrid"></div>
        </div>

        <div style="background:rgba(0, 210, 255, 0.02); padding:20px; border:1px solid #222;">
            <input type="text" id="qTitle" placeholder="Enter Quest Title">
            <input type="number" id="qTarget" placeholder="Target Goal (Multiples of 1000)">
            <button class="btn-system" style="background: var(--mana); color: #000; border: none; width:100%" onclick="addNewQuest(null)">Accept Quest</button>
        </div>

        <h3 style="color:var(--mana); font-size:0.75rem; margin:30px 0 15px 0; letter-spacing:3px;">ACTIVE QUEST LOG</h3>
        <div id="questList"></div>
    </div>

    <div id="dayView" class="full-view">
        <div class="back-btn" onclick="closeFullViews()">[ BACK ]</div>
        <h2 id="selectedDateTitle" style="color:var(--mana);">DATE</h2>
        <div style="background:rgba(255,255,255,0.05); padding:20px; margin-bottom:25px; border: 1px solid #333;">
            <input type="text" id="qTitleDay" placeholder="Quest Title">
            <input type="number" id="qTargetDay" placeholder="Target">
            <button class="btn-system" onclick="addNewQuestFromDay()">Register Quest</button>
        </div>
        <div id="dayArchiveList"></div>
    </div>

    <div id="rankView" class="full-view">
        <div class="back-btn" onclick="closeFullViews()">[ BACK ]</div>
        <h2 style="color:var(--gold);">RANKING</h2>
        <div id="rankContent" style="line-height: 2.8; font-family: monospace;"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD-j_kXAR8PqOPd1GBEst-sRWZNCpuFM7w",
            authDomain: "my-system-leveling.firebaseapp.com",
            projectId: "my-system-leveling",
            storageBucket: "my-system-leveling.firebasestorage.app",
            messagingSenderId: "894105661320",
            appId: "1:894105661320:web:beb8bdad2d4da8b97a943d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const FIXED_RATE = 89000;
        let system = { vault: 0, quests: [], dayArchives: {} };
        let navDate = new Date();
        let selectedDayKey = null;
        let currentUser = null;
        let isFirstLoad = true;

        // --- AUTH ---
        document.getElementById('loginBtn').onclick = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('mainView').style.display = 'block';
                document.getElementById('displayUserName').textContent = user.displayName.toUpperCase();
                
                onSnapshot(doc(db, "users", user.uid), (doc) => {
                    if (doc.exists()) {
                        system = doc.data();
                        render();
                        if (isFirstLoad) { triggerNotice(); isFirstLoad = false; }
                    } else { saveCloud(); }
                });
            } else {
                document.getElementById('authOverlay').style.display = 'flex';
                document.getElementById('mainView').style.display = 'none';
                isFirstLoad = true;
            }
        });

        async function saveCloud() { if (currentUser) await setDoc(doc(db, "users", currentUser.uid), system); }

        // --- SYSTEM AUDIO & NOTICE ---
        function playSystemSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
        }

        function triggerNotice(msg = null) {
            const notice = document.getElementById('systemNotice');
            const msgEl = document.getElementById('noticeMsg');
            
            if (!msg) {
                let count = system.quests.filter(q => q.current < q.target).length;
                msg = count > 0 ? `YOU HAVE ${count} UNCOMPLETED QUESTS.` : "ALL QUESTS COMPLETED. STANDING BY.";
            }

            msgEl.textContent = msg;
            notice.style.display = 'flex';
            playSystemSound();
            setTimeout(() => { notice.style.display = 'none'; }, 2500);
        }

        // --- APP LOGIC ---
        window.addNewQuest = function(customDate, customTitle, customTarget) {
            const titleInput = document.getElementById('qTitle'), targetInput = document.getElementById('qTarget');
            const title = customTitle || titleInput.value, target = customTarget || parseFloat(targetInput.value);
            if (title && target >= 1000) {
                system.quests.push({ id: Date.now(), title, target, current: 0, createdAt: customDate || new Date().toISOString().split('T')[0] });
                triggerNotice("NEW QUEST HAS ARRIVED.");
                titleInput.value = ''; targetInput.value = '';
                if (system.vault > 0) { let v = system.vault; system.vault = 0; applyTrickle(v); } else { render(); saveCloud(); }
            }
        };

        window.addNewQuestFromDay = function() {
            const t = document.getElementById('qTitleDay'), v = document.getElementById('qTargetDay');
            if (t.value && v.value) {
                addNewQuest(selectedDayKey, t.value, parseFloat(v.value));
                t.value = ''; v.value = ''; closeFullViews();
            }
        };

        window.applyTrickle = function(amount) {
            const todayStr = new Date().toISOString().split('T')[0];
            let completed = false;
            for (let q of system.quests) {
                if (q.createdAt > todayStr) continue;
                let needed = q.target - q.current;
                if (needed > 0) {
                    if (amount >= needed) { q.current = q.target; amount -= needed; completed = true; }
                    else { q.current += amount; amount = 0; break; }
                }
            }
            if (amount > 0) system.vault += amount;
            if (completed) triggerNotice("QUEST COMPLETED. REWARDS LOGGED.");
            checkAutoArchive(); render(); saveCloud();
        };

        // (Other helper functions remain identical to maintain logic)
        window.formatVal = (v) => v >= 1000000 ? (v/1000000).toFixed(1)+'M' : (v >= 1000 ? (v/1000)+'k' : v);
        function getRank(val) {
            if (val >= 100000000) return 'SS'; if (val >= 50000000) return 'S';
            if (val >= 10000000) return 'A'; if (val >= 2000000) return 'B';
            if (val >= 400000) return 'C'; return 'E';
        }

        window.render = function() {
            const qSum = system.quests.reduce((s,q) => s + q.current, 0);
            const arcSum = Object.values(system.dayArchives).flat().reduce((s,q)=>s+q.current,0);
            const total = qSum + arcSum + system.vault;

            document.getElementById('totalAssets').textContent = formatVal(total);
            document.getElementById('totalUSD').textContent = "$" + (total / FIXED_RATE).toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('mainLvl').textContent = Math.floor(total / 400000) + 1;
            document.getElementById('vaultAmount').textContent = formatVal(system.vault);
            
            const r = getRank(total);
            const rEl = document.getElementById('playerRankDisplay');
            rEl.textContent = "RANK " + r; rEl.style.color = `var(--rank-${r.toLowerCase()})`;

            const list = document.getElementById('questList'); list.innerHTML = '';
            system.quests.forEach(q => {
                const p = ((q.current / q.target) * 100).toFixed(1);
                const rk = getRank(q.target);
                list.innerHTML += `<div class="quest-card" style="border-left: 4px solid var(--rank-${rk.toLowerCase()})">
                    <div class="quest-title">${q.title}</div>
                    <div style="font-size:0.8rem; display:flex; justify-content:space-between;">
                        <span>${formatVal(q.current)} / ${formatVal(q.target)}</span>
                        <span style="color:var(--success)">$${(q.current/FIXED_RATE).toFixed(2)}</span>
                    </div>
                    <div class="progress-container"><div class="progress-fill" style="width:${p}%; background:var(--rank-${rk.toLowerCase()})"></div></div>
                </div>`;
            });
            drawCalendar();
        };

        function drawCalendar() {
            const grid = document.getElementById('daysGrid'); grid.innerHTML = '';
            const y = navDate.getFullYear(), m = navDate.getMonth();
            document.getElementById('monthDisplay').textContent = navDate.toLocaleString('en-US', { month: 'long', year: 'numeric' });
            const last = new Date(y, m + 1, 0).getDate();
            for (let i = 1; i <= last; i++) {
                const dKey = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const cell = document.createElement('div');
                cell.className = `day-cell ${system.dayArchives[dKey] ? 'has-completed' : ''}`;
                if(new Date().toDateString() === new Date(y,m,i).toDateString()) cell.classList.add('today');
                cell.textContent = i; cell.onclick = () => openDayView(dKey);
                grid.appendChild(cell);
            }
        }

        window.openDayView = (d) => {
            selectedDayKey = d; document.getElementById('mainView').style.display='none';
            document.getElementById('dayView').style.display='block';
            document.getElementById('selectedDateTitle').textContent = d;
            const l = document.getElementById('dayArchiveList'); l.innerHTML = '';
            (system.dayArchives[d] || []).forEach(q => {
                l.innerHTML += `<div class="quest-card" style="border-color:var(--gold)">🏆 ${q.title} - ${formatVal(q.target)}</div>`;
            });
        };

        function checkAutoArchive() {
            for (let i = 0; i < system.quests.length; i++) {
                if (system.quests[i].current >= system.quests[i].target) {
                    let d = system.quests[i].createdAt;
                    if (!system.dayArchives[d]) system.dayArchives[d] = [];
                    system.dayArchives[d].push(system.quests.splice(i, 1)[0]); i--;
                }
            }
        }

        window.changeMonth = (s) => { navDate.setMonth(navDate.getMonth() + s); drawCalendar(); };
        window.closeFullViews = () => { document.getElementById('mainView').style.display='block'; document.getElementById('dayView').style.display='none'; document.getElementById('rankView').style.display='none'; };
        window.openFullRankView = () => {
            document.getElementById('mainView').style.display='none';
            document.getElementById('rankView').style.display='block';
            document.getElementById('rankContent').innerHTML = `
                <b style="color:var(--rank-ss)">[SS] SOVEREIGN</b> (> 100M)<br>
                <b style="color:var(--rank-s)">[S] NATIONAL</b> (50M - 100M)<br>
                <b style="color:var(--rank-a)">[A] HIGH HUNTER</b> (10M - 50M)<br>
                <b style="color:var(--rank-b)">[B] INTERMEDIATE</b> (2M - 10M)<br>
                <b style="color:var(--rank-c)">[C] STANDARD</b> (400k - 2M)<br>
                <b style="color:var(--rank-e)">[E] WEAKEST</b> (< 400k)`;
        };
        
        window.startFlowDeposit = function() {
            let a = parseFloat(prompt("Assets to Deposit:"));
            if (a >= 1000 && a % 1000 === 0) applyTrickle(a);
        };

        window.globalWithdraw = function() {
            let qSum = system.quests.reduce((s,q) => s + q.current, 0);
            let arcSum = Object.values(system.dayArchives).flat().reduce((s,q)=>s+q.current,0);
            let total = qSum + arcSum + system.vault;
            let a = parseFloat(prompt(`Extract (Total: ${formatVal(total)}):`));
            if (a >= 1000 && a % 1000 === 0 && a <= total) {
                let rem = a;
                if (system.vault >= rem) { system.vault -= rem; rem = 0; }
                else { rem -= system.vault; system.vault = 0; }
                if (rem > 0) {
                    for (let i = system.quests.length - 1; i >= 0; i--) {
                        let q = system.quests[i];
                        if (q.current >= rem) { q.current -= rem; rem = 0; break; }
                        else { rem -= q.current; q.current = 0; }
                    }
                }
                if (rem > 0) {
                    let dates = Object.keys(system.dayArchives).sort().reverse();
                    for (let d of dates) {
                        let list = system.dayArchives[d];
                        for (let i = list.length - 1; i >= 0; i--) {
                            let q = list[i];
                            if (q.current >= rem) { q.current -= rem; rem = 0; }
                            else { rem -= q.current; q.current = 0; }
                            if (q.current < q.target) system.quests.unshift(list.splice(i, 1)[0]);
                        }
                    }
                }
                render(); saveCloud();
            }
        };

    </script>
</body>
</html>
