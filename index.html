<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUNG JIN-WOO | SYSTEM CLOUD V2</title>
    
    <link rel="manifest" href="/solo-leveling-system/manifest.json">
    <meta name="theme-color" content="#00d2ff">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2592/2592201.png">

    <style>
        :root {
            --bg: #05070b; --panel: rgba(17, 20, 29, 0.95); --mana: #00d2ff;
            --gold: #ffd700; --danger: #ff3131; --text: #e6edf3; --success: #50fa7b;
            --inventory: #ff79c6;
            --rank-ss: #ffcc00; --rank-s: #ff3131; --rank-a: #bc13fe;
            --rank-b: #00d2ff; --rank-c: #4caf50; --rank-e: #9e9e9e;
        }

        body { 
            background-color: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 0; overflow-x: hidden;
            background-image: radial-gradient(circle at center, #101525 0%, #05070b 100%);
            min-height: 100vh;
        }

        /* --- AUTHENTICATION SCREEN --- */
        #authOverlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 50000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .login-card {
            border: 1px solid var(--mana); padding: 50px 30px; background: rgba(0, 210, 255, 0.03);
            text-align: center; box-shadow: 0 0 50px rgba(0, 210, 255, 0.1);
            width: 85%; max-width: 400px; position: relative;
        }
        .login-card::before {
            content: "SYSTEM RESTRICTED"; position: absolute; top: -10px; left: 50%;
            transform: translateX(-50%); background: var(--bg); padding: 0 15px;
            color: var(--mana); font-size: 0.7rem; letter-spacing: 3px;
        }
        .btn-google {
            background: white; color: #000; border: none; padding: 15px 25px;
            font-weight: 900; cursor: pointer; display: flex; align-items: center;
            gap: 12px; margin: 40px auto 0; border-radius: 2px; font-size: 0.9rem;
            transition: 0.3s;
        }

        /* --- MAIN SYSTEM UI --- */
        #mainContainer { display: none; padding: 20px; animation: fadeIn 1s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .system-header {
            border: 1px solid var(--mana); background: rgba(0, 210, 255, 0.05);
            padding: 25px; border-radius: 4px; margin-bottom: 25px; position: relative;
            box-shadow: inset 0 0 30px rgba(0, 210, 255, 0.1);
        }
        .rank-tag { 
            position: absolute; top: -12px; right: 20px; background: var(--bg); 
            border: 1px solid var(--mana); padding: 5px 25px; font-size: 0.85rem; 
            font-weight: 900; color: var(--mana); box-shadow: 0 0 20px var(--mana);
        }
        .gold-main { 
            font-size: 3.2rem; color: var(--gold); display: block; font-weight: 900; 
            text-align: center; margin: 20px 0; font-family: 'Courier New', monospace;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .btn-system { 
            background: rgba(0, 0, 0, 0.8); border: 1px solid var(--mana); 
            color: var(--mana); padding: 16px; font-weight: 900; cursor: pointer; 
            text-transform: uppercase; font-size: 0.8rem; width: 100%; 
            transition: 0.2s; letter-spacing: 2px;
        }
        .btn-system:hover { background: var(--mana); color: #000; }

        /* --- QUEST CARDS --- */
        .quest-card { 
            background: var(--panel); border: 1px solid #222; padding: 20px; 
            margin-bottom: 18px; position: relative; 
            clip-path: polygon(0 0, 100% 0, 100% 85%, 95% 100%, 0 100%);
            transition: 0.3s; border-left: 5px solid var(--mana);
        }
        .rank-badge-watermark {
            position: absolute; right: 10px; bottom: 5px; font-size: 3rem;
            font-weight: 900; font-style: italic; opacity: 0.05; pointer-events: none;
        }
        .progress-container { height: 10px; background: #000; margin: 15px 0 5px 0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }

        /* --- CALENDAR --- */
        .calendar-box { background: var(--panel); padding: 20px; border: 1px solid #222; margin-bottom: 30px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .day-cell { 
            aspect-ratio: 1; background: #080a0f; border: 1px solid #1a1a1a; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 0.8rem; color: #555; cursor: pointer; transition: 0.2s;
        }
        .day-cell.today { border-color: var(--mana); color: var(--mana); box-shadow: inset 0 0 10px var(--mana); }
        .day-cell.has-completed { border-color: var(--gold); color: var(--gold); background: rgba(255,215,0,0.05); }

        /* --- NOTIFICATIONS --- */
        #systemNotice {
            display: none; position: fixed; inset: 0; background: rgba(0, 5, 15, 0.95); 
            z-index: 60000; justify-content: center; align-items: center; backdrop-filter: blur(10px);
        }
        .notice-window { 
            border: 2px solid var(--mana); background: #080a0f; padding: 40px; 
            text-align: center; width: 85%; max-width: 450px;
            box-shadow: 0 0 100px rgba(0,210,255,0.2);
        }

        input { 
            width: 100%; padding: 18px; margin-bottom: 15px; background: #0c1018; 
            border: 1px solid #333; color: white; font-size: 1rem; outline: none;
        }
        input:focus { border-color: var(--mana); }

        .discard-btn { 
            position: absolute; right: 15px; top: 15px; background: none; 
            border: 1px solid var(--danger); color: var(--danger); 
            font-size: 0.7rem; padding: 5px 10px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="systemNotice">
        <div class="notice-window">
            <div style="color: var(--mana); font-size: 0.7rem; letter-spacing: 5px; margin-bottom: 20px;">SYSTEM NOTIFICATION</div>
            <div id="noticeMsg" style="font-size: 1.3rem; font-weight: 900; text-transform: uppercase;">INITIALIZING...</div>
        </div>
    </div>

    <div id="authOverlay">
        <div class="login-card">
            <h1 style="color: var(--mana); letter-spacing: 8px; margin: 0; font-size: 1.8rem;">SYSTEM</h1>
            <p style="font-size: 0.75rem; color: var(--mana); opacity: 0.5; margin-top: 10px;">LEVELING SYSTEM ACCESS</p>
            <button class="btn-google" id="loginBtn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="22">
                CONTINUE WITH GOOGLE
            </button>
        </div>
    </div>

    <div id="mainContainer">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <div id="userName" style="color: var(--mana); font-size: 0.75rem; font-weight: 900; letter-spacing: 2px;">PLAYER: ---</div>
            <button onclick="logout()" style="color: var(--danger); background: none; border: 1px solid var(--danger); font-size: 0.7rem; padding: 6px 15px; font-weight: 900; cursor: pointer; letter-spacing: 1px;">LOGOUT</button>
        </div>

        <div class="system-header">
            <div class="rank-tag" id="playerRankDisplay">RANK E</div>
            <div style="font-size: 0.65rem; color: var(--mana); letter-spacing: 4px; border-bottom: 1px solid rgba(0,210,255,0.2); padding-bottom: 8px; margin-bottom: 15px;">PLAYER STATUS</div>
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <div style="color: #666; font-size: 0.6rem; margin-bottom: 2px;">IDENTIFICATION</div>
                    <div id="displayPlayerName" style="font-weight: 900; font-size: 1.3rem; text-shadow: 0 0 10px var(--mana);">---</div>
                </div>
                <div style="text-align: right;">
                    <div style="color: #666; font-size: 0.6rem; margin-bottom: 2px;">LEVEL</div>
                    <div style="color: var(--mana); font-weight: 900; font-size: 1.3rem; font-family: monospace;">LVL <span id="mainLvl">1</span></div>
                </div>
            </div>
            <span class="gold-main" id="totalAssets">0</span>
            <div style="text-align: center; color: var(--success); font-weight: 900; font-family: monospace; font-size: 1.4rem; letter-spacing: 1px;" id="totalUSD">$0.00</div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px;">
            <button class="btn-system" onclick="depositAssets()">+ Add Assets</button>
            <button class="btn-system" style="border-color: var(--inventory); color: var(--inventory); position: relative;" id="vaultBtn">
                Vault: 0
            </button>
        </div>

        <div class="calendar-box">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center; border-bottom: 1px solid #222; padding-bottom: 10px;">
                <button onclick="changeMonth(-1)" style="background:none; border:none; color:var(--mana); cursor:pointer; font-weight: 900;">&lt;</button>
                <div id="monthDisplay" style="font-size:0.9rem; font-weight: 900; color: var(--mana); letter-spacing: 2px;">MONTH</div>
                <button onclick="changeMonth(1)" style="background:none; border:none; color:var(--mana); cursor:pointer; font-weight: 900;">&gt;</button>
            </div>
            <div class="days-grid" id="daysGrid"></div>
        </div>

        <div style="background: rgba(0, 210, 255, 0.03); padding: 25px; border: 1px solid #222; margin-bottom: 40px; position: relative;">
            <div style="color: var(--mana); font-size: 0.7rem; margin-bottom: 20px; letter-spacing: 3px; font-weight: 900;">[ NEW DAILY QUEST ]</div>
            <input type="text" id="qTitle" placeholder="Quest Objective Name">
            <input type="number" id="qTarget" placeholder="Gold Reward Goal (e.g. 5000)">
            <button class="btn-system" style="background: var(--mana); color: #000; border: none;" onclick="addNewQuest()">ACCEPT QUEST</button>
        </div>

        <h3 style="color: var(--mana); font-size: 0.8rem; letter-spacing: 4px; border-left: 4px solid var(--mana); padding-left: 15px; margin-bottom: 25px; font-weight: 900;">ACTIVE QUEST LOG</h3>
        <div id="questList"></div>
        
        <div style="text-align: center; margin-top: 50px; opacity: 0.3; font-size: 0.6rem; letter-spacing: 5px;">SUNG JIN-WOO SYSTEM © 2025</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD-j_kXAR8PqOPd1GBEst-sRWZNCpuFM7w",
            authDomain: "my-system-leveling.firebaseapp.com",
            projectId: "my-system-leveling",
            storageBucket: "my-system-leveling.firebasestorage.app",
            messagingSenderId: "894105661320",
            appId: "1:894105661320:web:beb8bdad2d4da8b97a943d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let system = { vault: 0, quests: [], dayArchives: {} };
        let currentUser = null;
        let navDate = new Date();
        const FIXED_RATE = 89000;

        function getTodayStr() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function showNotice(msg) {
            const el = document.getElementById('systemNotice');
            document.getElementById('noticeMsg').textContent = msg;
            el.style.display = 'flex';
            setTimeout(() => el.style.display = 'none', 1800);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
                document.getElementById('userName').textContent = "PLAYER: " + user.displayName.toUpperCase();
                document.getElementById('displayPlayerName').textContent = user.displayName.toUpperCase();
                
                onSnapshot(doc(db, "users", user.uid), (doc) => {
                    if (doc.exists()) {
                        system = doc.data();
                        render();
                    } else {
                        saveToCloud();
                    }
                });
            } else {
                document.getElementById('authOverlay').style.display = 'flex';
                document.getElementById('mainContainer').style.display = 'none';
            }
        });

        async function saveToCloud() {
            if (currentUser) await setDoc(doc(db, "users", currentUser.uid), system);
        }

        window.depositAssets = () => {
            let a = parseFloat(prompt("QUANTITY TO DEPOSIT:"));
            if (a >= 1000 && a % 1000 === 0) {
                applyTrickle(a);
                showNotice("ASSETS ABSORBED");
            }
        };

        function applyTrickle(amount) {
            const today = getTodayStr();
            for (let q of system.quests) {
                if (q.createdAt > today) continue;
                let needed = q.target - q.current;
                if (needed > 0) {
                    if (amount >= needed) { q.current = q.target; amount -= needed; }
                    else { q.current += amount; amount = 0; break; }
                }
            }
            if (amount > 0) system.vault += amount;
            checkAutoArchive();
            saveToCloud();
        }

        window.addNewQuest = () => {
            const title = document.getElementById('qTitle').value;
            const target = parseFloat(document.getElementById('qTarget').value);
            if (title && target >= 1000) {
                system.quests.push({ 
                    id: Date.now(), 
                    title, 
                    target, 
                    current: 0, 
                    createdAt: getTodayStr() 
                });
                document.getElementById('qTitle').value = '';
                document.getElementById('qTarget').value = '';
                if(system.vault > 0) {
                    let v = system.vault; system.vault = 0;
                    applyTrickle(v);
                } else {
                    saveToCloud();
                }
                showNotice("QUEST ACCEPTED");
            }
        };

        function checkAutoArchive() {
            system.quests = system.quests.filter(q => {
                if (q.current >= q.target) {
                    const d = q.createdAt;
                    if (!system.dayArchives[d]) system.dayArchives[d] = [];
                    system.dayArchives[d].push(q);
                    return false;
                }
                return true;
            });
        }

        window.discardQuest = (id) => {
            if(!confirm("Discard Quest?")) return;
            const idx = system.quests.findIndex(q => q.id === id);
            if (idx > -1) {
                let refund = system.quests[idx].current;
                system.quests.splice(idx, 1);
                if (refund > 0) applyTrickle(refund);
                else saveToCloud();
            }
        };

        function getRank(val) {
            if (val >= 100000000) return 'SS';
            if (val >= 50000000) return 'S';
            if (val >= 10000000) return 'A';
            if (val >= 2000000) return 'B';
            if (val >= 400000) return 'C';
            return 'E';
        }

        function render() {
            const today = getTodayStr();
            const qSum = system.quests.reduce((s,q) => s + q.current, 0);
            const allArc = Object.values(system.dayArchives).flat();
            const arcSum = allArc.reduce((s,q)=>s+q.current,0);
            const total = qSum + arcSum + system.vault;

            document.getElementById('totalAssets').textContent = total.toLocaleString();
            document.getElementById('totalUSD').textContent = "$" + (total / FIXED_RATE).toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('mainLvl').textContent = Math.floor(total / 400000) + 1;
            document.getElementById('vaultBtn').textContent = "VAULT: " + system.vault.toLocaleString();

            const r = getRank(total);
            const rDisplay = document.getElementById('playerRankDisplay');
            rDisplay.textContent = "RANK " + r;
            rDisplay.style.color = `var(--rank-${r.toLowerCase()})`;
            rDisplay.style.borderColor = `var(--rank-${r.toLowerCase()})`;

            const list = document.getElementById('questList');
            list.innerHTML = '';
            system.quests.forEach(q => {
                const isLocked = q.createdAt > today;
                const p = (q.current / q.target) * 100;
                const qRank = getRank(q.target);
                list.innerHTML += `
                    <div class="quest-card ${isLocked ? 'quest-locked' : ''}" style="border-left: 4px solid var(--rank-${qRank.toLowerCase()})">
                        <div class="rank-badge-watermark" style="color: var(--rank-${qRank.toLowerCase()})">${qRank}</div>
                        <button class="discard-btn" onclick="discardQuest(${q.id})">DISCARD</button>
                        <div style="font-size: 0.6rem; color: #666; margin-bottom: 8px; font-weight: 900; letter-spacing: 1px;">
                            ${isLocked ? '🔒 UNLOCKS ON: ' + q.createdAt : 'SYSTEM ACTIVE'}
                        </div>
                        <div style="font-weight:900; text-transform:uppercase; font-size: 1.1rem; letter-spacing: 1px;">${q.title}</div>
                        <div style="display:flex; justify-content:space-between; font-size:0.8rem; font-family:monospace; margin-top:10px; font-weight:bold;">
                            <span>${q.current.toLocaleString()} / ${q.target.toLocaleString()}</span>
                            <span style="color:var(--success)">$${(q.current/FIXED_RATE).toFixed(2)}</span>
                        </div>
                        <div class="progress-container"><div class="progress-fill" style="width:${p}%; background:var(--rank-${qRank.toLowerCase()}); box-shadow: 0 0 15px var(--rank-${qRank.toLowerCase()})"></div></div>
                    </div>`;
            });
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('daysGrid'); grid.innerHTML = '';
            const y = navDate.getFullYear(), m = navDate.getMonth();
            document.getElementById('monthDisplay').textContent = navDate.toLocaleString('en-US', { month: 'LONG', year: 'NUMERIC' });
            const first = new Date(y, m, 1).getDay();
            const last = new Date(y, m + 1, 0).getDate();
            const today = getTodayStr();
            for (let i = 0; i < first; i++) grid.innerHTML += '<div></div>';
            for (let i = 1; i <= last; i++) {
                const dKey = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const hasArc = system.dayArchives[dKey] && system.dayArchives[dKey].length > 0;
                const cell = document.createElement('div');
                cell.className = `day-cell ${dKey === today ? 'today' : ''} ${hasArc ? 'has-completed' : ''}`;
                cell.textContent = i;
                grid.appendChild(cell);
            }
        }

        window.changeMonth = (val) => { navDate.setMonth(navDate.getMonth() + val); renderCalendar(); };
        window.logout = () => signOut(auth);
        document.getElementById('loginBtn').onclick = () => signInWithPopup(auth, provider);

    </script>
</body>
</html>
